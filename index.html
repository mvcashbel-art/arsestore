<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffc21a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>ARSE Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a shop counter. Awning on top, signboard-yellow accent, ruled-notebook ledger rows, blueprint-style store map. */
  --paper:#f3f5fb;
  --card:#ffffff;
  --ink:#15203b;
  --muted:#5a6483;
  --line:#dde2f0;
  --sign:#ffc21a;
  --on-sign:#15203b;
  --awn2:#15203b;
  --red:#c9372c;
  --red-bg:#fdeceb;
  --green:#1b7f49;
  --green-bg:#e4f4ea;
  --warn-bg:#fff1c7;
  --warn-ink:#6b4b00;
  --display:'Bungee',Impact,'Arial Black',sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e1324;--card:#172039;--ink:#eef1fb;--muted:#a0abcb;--line:#2a3555;
    --awn2:#3b4b8a;--red:#ff7a6b;--red-bg:#3a1c22;--green:#4fcb86;--green-bg:#17301f;
    --warn-bg:#3b3010;--warn-ink:#ffd978;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1324;--card:#172039;--ink:#eef1fb;--muted:#a0abcb;--line:#2a3555;
  --awn2:#3b4b8a;--red:#ff7a6b;--red-bg:#3a1c22;--green:#4fcb86;--green-bg:#17301f;
  --warn-bg:#3b3010;--warn-ink:#ffd978;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.4 var(--body);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.awning{height:14px;background:linear-gradient(90deg,var(--sign) 50%,var(--awn2) 50%) 0 0/48px 100%}
.scallop{height:12px;background:radial-gradient(circle at 12px 0,var(--sign) 12px,transparent 12.5px),radial-gradient(circle at 36px 0,var(--awn2) 12px,transparent 12.5px);background-size:48px 12px;background-repeat:repeat-x}
.app{max-width:560px;margin:0 auto;padding:0 16px 170px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.shop{font:22px/1.1 var(--display);letter-spacing:.2px;text-wrap:balance;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.ctrl{display:flex;gap:8px;align-items:center;flex-shrink:0}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-weight:700;font-size:13px;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:2px solid var(--ink);background:transparent;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.banner button{border:0;background:var(--warn-ink);color:var(--warn-bg);border-radius:8px;padding:6px 10px;font-weight:700;min-height:32px;flex-shrink:0}
.search input,.field input,.field select,.field textarea{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:10px 12px;font:inherit}
.search input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.search{margin-bottom:12px}
.catrow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 6px;scrollbar-width:none}
.catrow::-webkit-scrollbar{display:none}
.catrow .pick{white-space:nowrap;flex-shrink:0;min-height:40px;padding:6px 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
.prod{position:relative;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.prod:active{transform:scale(.98)}
.prod .pn{font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.prod .pl{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.prod .pp{font:19px/1 var(--display)}
.prod .pp small{font:12px var(--body);color:var(--muted)}
.prod.in{border-color:var(--ink)}
.prod[disabled]{opacity:.45;cursor:not-allowed}
.prod .qty{position:absolute;top:-8px;right:-6px;background:var(--sign);color:var(--on-sign);font:700 13px var(--body);border-radius:99px;min-width:28px;height:28px;display:grid;place-items:center;padding:0 7px;border:2px solid var(--on-sign)}
.prod.other{border-style:dashed;color:var(--muted);align-items:flex-start}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--paper);color:var(--muted);white-space:nowrap}
.chip.low{background:var(--warn-bg);color:var(--warn-ink)}
.chip.out,.chip.old{background:var(--red-bg);color:var(--red)}
.chip.ok{background:var(--green-bg);color:var(--green)}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.btn{min-height:48px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:700;padding:0 16px}
.btn.primary{background:var(--sign);color:var(--on-sign);border-color:var(--on-sign)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost-red{color:var(--red);border-color:var(--red)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.cartbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));padding:0 16px;z-index:5;pointer-events:none}
.cartbar button{pointer-events:auto;display:flex;max-width:528px;margin:0 auto;width:100%;align-items:center;justify-content:space-between;gap:10px;min-height:56px;border-radius:16px;border:2px solid var(--on-sign);background:var(--sign);color:var(--on-sign);padding:0 16px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.cartbar strong{font:20px/1 var(--display)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:12px;font-weight:700;color:var(--muted);position:relative;min-height:64px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-2px;left:20%;right:20%;height:4px;border-radius:0 0 4px 4px;background:var(--sign)}
.sign{background:var(--sign);color:var(--on-sign);border-radius:16px;padding:16px;margin-bottom:14px;border:2px solid var(--on-sign)}
.sign .k{font-weight:700;font-size:14px}
.sign .big{font:36px/1.1 var(--display);margin:4px 0}
.sign .s{font-size:14px}
.bar-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.h2{font:15px/1.2 var(--display);margin:0}
.ledger{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:inset 4px 0 0 var(--red-bg)}
.ledger>*{border-bottom:1px solid var(--line)}
.ledger>*:last-child{border-bottom:0}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:12px 14px 12px 18px;min-height:60px}
.lrow .nm{flex:1;min-width:0}
.lrow .nm b{display:block;overflow-wrap:anywhere}
.lrow .nm small{color:var(--muted);display:block}
.amt{font-weight:700;font-size:17px;white-space:nowrap}
.amt small{font-weight:400;font-size:12px;color:var(--muted)}
.amt.red{color:var(--red)}
.amt.green{color:var(--green)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
.tile .k{font-size:13px;color:var(--muted);font-weight:700}
.tile .v{font:21px/1.2 var(--display);margin-top:4px}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.daynav strong{font:16px var(--display)}
.sq{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:20px;font-weight:700;display:grid;place-items:center;padding:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:10px}
.bars button{flex:1;border:0;background:none;padding:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.bars i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--line);min-height:3px}
.bars button[aria-pressed="true"] i{background:var(--sign);outline:2px solid var(--on-sign);outline-offset:-2px}
.bars span{font-size:12px;color:var(--muted);font-weight:700}
.bars em{font-style:normal;font-size:11px;font-weight:700;white-space:nowrap}
.scrim{position:fixed;inset:0;background:rgba(10,16,35,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.scrim.open{display:flex}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sh-title{font:18px/1.2 var(--display);margin:0 0 4px;overflow-wrap:anywhere}
.sh-sub{color:var(--muted);margin:0 0 12px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
.field small{color:var(--muted);display:block;margin-top:4px}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.line .ln{flex:1;min-width:0}
.line .ln b{display:block;overflow-wrap:anywhere}
.line .ln small{color:var(--muted)}
.line .lt{font-weight:700;min-width:60px;text-align:right}
.step{display:flex;align-items:center;gap:6px}
.step .sq{width:40px;height:40px}
.step .qin{width:58px;min-height:40px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);text-align:center;font:700 16px var(--body);padding:0 4px}
.totalrow{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0}
.totalrow strong{font:30px/1 var(--display)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pick{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;min-height:44px;font-weight:700;text-align:left}
.pick small{display:block;font-weight:400;color:var(--muted)}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--sign);color:var(--on-sign)}
.pick[aria-pressed="true"] small{color:var(--on-sign)}
.change{border-radius:12px;padding:12px;font-weight:700;text-align:center;background:var(--green-bg);color:var(--green);margin-bottom:12px;font-size:18px}
.change.bad{background:var(--red-bg);color:var(--red)}
.hist{max-height:260px;overflow:auto;margin:12px 0;border:2px solid var(--line);border-radius:12px;box-shadow:inset 4px 0 0 var(--red-bg)}
.hist .h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.hist .h:last-child{border-bottom:0}
.hist small{color:var(--muted);display:block}
.hist .amt small{display:inline}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.sale{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 18px}
.sale .nm{flex:1;min-width:0}
.sale small{color:var(--muted);display:block;overflow-wrap:anywhere}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:8px 4px;min-height:36px}
.divider{height:1px;background:var(--line);margin:16px 0}
a.btn{display:grid;place-items:center;text-decoration:none}
textarea{resize:vertical;min-height:84px}
/* Store map */
.mapwrap{border:2px solid var(--line);border-radius:14px;overflow:auto;background:var(--card);max-height:64vh;-webkit-overflow-scrolling:touch}
.mapwrap.editing{touch-action:none;border-color:var(--ink)}
.mapwrap svg{display:block;user-select:none;-webkit-user-select:none}
.m-bg{fill:var(--card)}
.m-grid{fill:none;stroke:var(--line);stroke-width:.03}
.m-out{fill:none;stroke:var(--ink);stroke-width:.12}
.m-label{fill:var(--ink);font-family:var(--body);font-weight:700;pointer-events:none}
.m-shape{cursor:pointer}
.maptools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 12px}
.maptools .zoom{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--muted)}
.maptools .sq{width:40px;height:40px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.dayh{background:var(--paper);font-size:12px;font-weight:700;color:var(--muted);padding:6px 14px 6px 18px;text-transform:uppercase;letter-spacing:.4px}
.doc{background:#fff;color:#15203b;border:2px dashed #b9c0d8;border-radius:10px;padding:16px;font-variant-numeric:tabular-nums}
.doc .dh{text-align:center;border-bottom:2px dashed #b9c0d8;padding-bottom:10px;margin-bottom:10px}
.doc .dshop{font:18px/1.2 var(--display);overflow-wrap:anywhere}
.doc .dt{font-weight:700;letter-spacing:2px;margin-top:4px}
.doc .dd{font-size:13px;color:#5a6483}
.doc .dd.center{text-align:center;margin-top:10px}
.doc .dl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dotted #c9cfe2}
.doc .dl small{display:block;color:#5a6483}
.doc .dtot{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px}
.doc .dtot strong{font:22px var(--display)}
.doc .field span{color:#15203b}
.doc input{background:#f3f5fb;color:#15203b;border-color:#dde2f0}
.scanbtn{padding:0 14px;min-width:52px}
.scanbtn svg{width:22px;height:22px;display:block;margin:auto}
@media print{
  body:not(.pr-rpt)>*:not(.scrim){display:none!important}
  body.pr-rpt{--paper:#fff;--card:#fff;--ink:#15203b;--muted:#5a6483;--line:#dde2f0;background:#fff!important;color:#15203b}
  body.pr-rpt>*:not(.app){display:none!important}
  body.pr-rpt .app>*:not(main){display:none!important}
  body.pr-rpt main>*:not(#rptdoc){display:none!important}
  body.pr-rpt .app{padding:0!important;max-width:none!important}
  body.pr-rpt .card,body.pr-rpt .tile,body.pr-rpt .ledger{break-inside:avoid}
  body.pr-rpt .bar-actions{break-after:avoid}
  .scrim{position:static!important;background:none!important;display:block!important}
  .sheet{box-shadow:none!important;max-height:none!important;overflow:visible!important;padding:0!important;background:#fff!important}
  .noprint,.grab{display:none!important}
  .doc{border:0!important}
}
.search.withscan{display:flex;gap:8px}
.search.withscan input{min-width:0;flex:1}
.dchip{display:block;font:700 12px var(--body);margin-top:2px;color:var(--muted)}
.dchip.up{color:var(--green)}.dchip.dn{color:var(--red)}
.find{display:flex;gap:10px;padding:12px 14px 12px 16px}
.find b{display:block;font-weight:700;overflow-wrap:anywhere}
.find small{display:block;color:var(--muted);margin-top:2px}
.find .dot{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--body);color:#fff;margin-top:1px}
.dot.good{background:var(--green)}.dot.warn{background:#c98a00}.dot.bad{background:var(--red)}.dot.info{background:var(--muted)}
.pwrap{position:relative;display:flex}
.pwrap .prod{flex:1;width:100%}
.pminus{position:absolute;top:-14px;left:-12px;z-index:2;width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;border:3px solid var(--paper);font:700 24px/1 var(--body);display:grid;place-items:center;padding:0}
.cartbar .cartwrap{display:flex;gap:8px;max-width:528px;margin:0 auto;pointer-events:auto}
.cartbar .cartwrap button{margin:0;max-width:none}
.cartbar .cartwrap .clr{flex:none;width:56px;background:var(--card);color:var(--red);border-color:var(--red);font:700 20px var(--body);justify-content:center}
.cartbar .cartwrap .clr.armed{background:var(--red);color:#fff}
.cartbar .cartwrap [data-act="checkout"]{flex:1;width:auto}
.sq.rm{color:var(--red);border-color:var(--red);width:40px;height:40px;font-size:16px}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;flex-shrink:0;color:transparent}
.chk.on{background:var(--sign);border-color:var(--on-sign);color:var(--on-sign)}
.lblgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.lbl{background:#fff;color:#000;border:1.5px dashed #9aa3bd;border-radius:6px;padding:6px 8px;break-inside:avoid;text-align:center}
.lbl .ln1{font:700 12px/1.15 var(--body);overflow-wrap:anywhere;max-height:2.4em;overflow:hidden}
.lbl .ln2{font:700 13px var(--body);margin:2px 0 4px}
.lbl .ln3{font:11px/1 monospace;letter-spacing:1px;margin-top:3px}
.bc{width:100%;height:46px;display:block;background:#fff}
@page{margin:8mm}
@media print{.lblgrid{grid-template-columns:repeat(3,1fr)}}
.rvl{display:flex;align-items:flex-end;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rvl .ln{flex:1 1 100%;min-width:0}
.rvl .ln b{display:block;overflow-wrap:anywhere}
.rvl .ln small{color:var(--green);font-weight:700}
.rvf{display:block;flex:1;min-width:0}
.rvf span{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}
.rvf input{width:100%;min-height:44px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:6px 10px;font:inherit}
.rpt .rh{text-align:center;border-bottom:2px solid var(--line);padding-bottom:10px}
.rpt .rh .dshop{font:20px/1.2 var(--display);overflow-wrap:anywhere}
.rpt .rh .dt{font-weight:700;margin-top:4px}
.rpt .rh .dd{font-size:13px;color:var(--muted)}
.rpt .tiles{margin-top:12px}
.mbars{display:flex;align-items:flex-end;gap:2px;height:90px;margin-top:10px}
.mbars i{flex:1;background:var(--line);border-radius:3px 3px 0 0;min-height:2px}
.mbars i.best{background:var(--sign);outline:1.5px solid var(--on-sign);outline-offset:-1.5px}
.mlab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.crow{display:grid;grid-template-columns:minmax(90px,1.1fr) minmax(60px,1fr) auto;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.crow .cn{overflow-wrap:anywhere}
.crow .cb{height:10px;background:var(--paper);border-radius:99px;overflow:hidden}
.crow .cb i{display:block;height:100%;background:var(--sign);border-radius:99px}
.crow .cv{font-weight:700;text-align:right;white-space:nowrap}
.crow .cv small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.vtog{display:flex;margin-bottom:12px}.vtog button{flex:1;min-height:44px;font-size:14px}
.v3wrap{position:relative;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#e5eaf1;height:min(58vh,520px)}
.v3wrap.placing{border-color:var(--sign);box-shadow:0 0 0 3px var(--sign)}
#v3d{position:absolute;inset:0}
#v3d model-viewer{width:100%;height:100%;--poster-color:transparent;background:linear-gradient(#f3f6fa,#d5dde8)}
.v3msg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-weight:700;color:#475569;padding:0 24px;pointer-events:none;z-index:1}
.v3tools{flex-wrap:wrap}.v3tools .btn{white-space:nowrap}.v3tools>span{flex-wrap:wrap}
.pin3d{position:relative;width:22px;height:22px;min-height:0;padding:0;border-radius:50%;border:3px solid #fff;background:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.55);cursor:pointer}
.pin3d::before{content:'';position:absolute;inset:-12px}
.pin3d .pl{display:none;position:absolute;left:50%;bottom:30px;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;pointer-events:none}
.pin3d.hit,.pin3d.sel{background:var(--sign);width:26px;height:26px}
.pin3d.hit .pl,.pin3d.sel .pl{display:block}
.pin3d.dim{opacity:.35}
.discrow{display:flex;align-items:center;gap:10px;margin:10px 0}.discrow>span{font-weight:700;flex:0 0 auto}.discrow input{flex:1;min-width:0;min-height:44px;border:2px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;background:var(--card);color:var(--ink)}
.discrow .seg button{min-height:44px;padding:0 14px}.tierbar{display:flex;margin:0 0 10px}.tierbar button{flex:1;min-height:40px}.discrow .tierbar{margin:0;flex:1}
.sublines .line{padding:2px 0}.dlogo{display:block;max-height:64px;max-width:70%;margin:0 auto 6px;object-fit:contain}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const t=(k,v)=>{let s=(T[S.lang]&&T[S.lang][k])||T.en[k]||k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2=n=>Math.round((+n||0)*100)/100;
const r3=n=>Math.round((+n||0)*1000)/1000;
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const fq=n=>String(r3(n));
const peso=n=>{n=r2(n);const neg=n<0;n=Math.abs(n);return (neg?'-':'')+'₱'+n.toLocaleString('en-PH',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2})};
const pad=n=>String(n).padStart(2,'0');
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const startOfDay=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const timeStr=ts=>new Date(ts).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'});
const dateStr=(ts,o)=>new Date(ts).toLocaleDateString('en-PH',o||{month:'short',day:'numeric'});

function loadData(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.v===1&&Array.isArray(d.products))return d}}catch(e){}return mem}

  ['moves','expenses','closings','quotes','deliveries'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
  d.bcNext=+d.bcNext||1;
  d.customers.forEach(c=>{c.tier=c.tier||'retail';c.limit=+c.limit||0;c.terms=+c.terms||0});
  d.orders=Array.isArray(d.orders)?d.orders:[];
  d.info=d.info&&typeof d.info==='object'?d.info:{};['addr','phone','line','foot','logo'].forEach(k=>{d.info[k]=d.info[k]||''});

  d.map=d.map&&Array.isArray(d.map.shapes)?d.map:blankMap();
  d.map.bgOp=d.map.bgOp||.5;
  if(!Array.isArray(d.map.pins))d.map.pins=[];
  return d;
}

  const ps=S.products.filter(p=>matchP(p,q)&&(!ui.cat||p.cat===ui.cat)).sort((a,b)=>a.name.localeCompare(b.name));
  const cards=ps.map(p=>{

    const where=locLabel(p);

  }).join('');

function addToCart(pid){
  const p=S.products.find(x=>x.id===pid);if(!p)return;
  const line=ui.cart.find(l=>l.pid===pid);
  if(line){
    const av=availOf(p);if(av!==null&&line.qty+1>av){toast(t('stock_left',{n:fq(av)}));return}

function hitSet(){

function shapesHTML(){
  const hits=hitSet(),lows=new Set(S.products.filter(p=>p.loc&&lowOf(p)).map(p=>p.loc));
  const z=ZOOMS[ui.zi];
  return S.map.shapes.map(s=>{
    const k=KINDS[s.kind]||KINDS.shelf,hit=hits.has(s.id),sel=ui.mapEdit&&ui.sel===s.id;
    const fill=hit?'var(--sign)':k.c,fo=hit?.75:.28;
    const stroke=sel?'var(--ink)':hit?'var(--on-sign)':k.c;
    const sw=sel?.1:hit?.1:.06;
    const vert=s.h>s.w*1.4,len=vert?s.h:s.w,name=s.name||'';
    const fs=clamp(len/Math.max(1,name.length)/.58,.17,.36);
    const cx=s.x+s.w/2,cy=s.y+s.h/2;
    const label=(s.kind==='wall'||(s.h<.3&&!vert))?'':`<text class="m-label" x="${cx}" y="${cy}" font-size="${fs}" text-anchor="middle" dominant-baseline="central"${vert?` transform="rotate(-90 ${cx} ${cy})"`:''}>${esc(name)}</text>`;
    const thinLabel=(s.h<.3&&s.kind!=='wall'&&!vert)?`<text class="m-label" x="${cx}" y="${s.y-.12}" font-size=".26" text-anchor="middle">${esc(name)}</text>`:'';
    const low=lows.has(s.id)?`<circle cx="${s.x+s.w-.12}" cy="${s.y+.12}" r=".14" style="fill:var(--red);stroke:var(--card);stroke-width:.04"/>`:'';
    const handle=sel?`<circle cx="${s.x+s.w}" cy="${s.y+s.h}" r="${.9/z}" style="fill:transparent" data-handle="1"/><circle cx="${s.x+s.w}" cy="${s.y+s.h}" r="${.4/z}" style="fill:var(--sign);stroke:var(--ink);stroke-width:${.07/z}" data-handle="1"/>`:'';
    return `<g class="m-shape" data-shape="${esc(s.id)}"><rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx=".06" style="fill:${fill};fill-opacity:${fo};stroke:${stroke};stroke-width:${sw}${sel?';stroke-dasharray:.25 .12':''}"/>${label}${thinLabel}${low}${handle}</g>`;
  }).join('');
}
function mapSVG(){

function mapInfo(){

function refreshShapes(){const g=$('#mapshapes');if(g)g.innerHTML=shapesHTML()}
function refreshMap(info){
  const w=$('#mapwrap');if(!w)return;
  const sl=w.scrollLeft,st=w.scrollTop;
  w.innerHTML=mapSVG();w.scrollLeft=sl;w.scrollTop=st;
  if(info){const i=$('#mapinfo');if(i)i.innerHTML=mapInfo()}

function mapPt(e){
  const svg=document.querySelector('#mapsvg'),r=svg.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*S.map.w,y:(e.clientY-r.top)/r.height*S.map.h};
}
let mdrag=null;
document.addEventListener('pointerdown',e=>{
  const wrap=e.target.closest&&e.target.closest('#mapwrap');if(!wrap)return;
  const sh=e.target.closest('[data-shape]'),hd=e.target.closest('[data-handle]');
  mdrag={sx:e.clientX,sy:e.clientY,moved:false,id:sh?sh.dataset.shape:null,handle:!!hd,sl:wrap.scrollLeft,st:wrap.scrollTop};
  if(ui.mapEdit){
    if(sh&&!hd)ui.sel=sh.dataset.shape;
    const s=ui.sel&&shapeById(ui.sel);
    if(s){const p=mapPt(e);mdrag.ox=p.x-s.x;mdrag.oy=p.y-s.y}
    if(sh)refreshShapes();
    try{wrap.setPointerCapture(e.pointerId)}catch(_){}
  }
});
document.addEventListener('pointermove',e=>{
  if(!mdrag||!ui.mapEdit)return;
  const dx=e.clientX-mdrag.sx,dy=e.clientY-mdrag.sy;
  if(!mdrag.moved&&Math.hypot(dx,dy)<6)return;
  mdrag.moved=true;
  const wrap=$('#mapwrap');
  if(mdrag.handle||mdrag.id){
    const s=shapeById(ui.sel);if(!s)return;const p=mapPt(e);
    if(mdrag.handle){s.w=clamp(snap(p.x-s.x),.1,S.map.w-s.x);s.h=clamp(snap(p.y-s.y),.1,S.map.h-s.y)}
    else{s.x=clamp(snap(p.x-mdrag.ox),0,Math.max(0,S.map.w-s.w));s.y=clamp(snap(p.y-mdrag.oy),0,Math.max(0,S.map.h-s.h))}
    refreshShapes();
  }else if(wrap){wrap.scrollLeft=mdrag.sl-dx;wrap.scrollTop=mdrag.st-dy}
});
document.addEventListener('pointerup',()=>{
  if(!mdrag)return;const d=mdrag;mdrag=null;
  if(ui.mapEdit){
    if(d.moved&&(d.id||d.handle))save();
    if(!d.moved&&!d.id&&!d.handle)ui.sel=null;
    refreshMap(true);
  }
});
document.addEventListener('pointercancel',()=>{mdrag=null});

function todayHTML(){
  const now=Date.now(),key=ui.day,isToday=key===dayKey(now);
  const sales=S.sales.filter(s=>dayKey(s.ts)===key).sort((a,b)=>b.ts-a.ts);
  const led=S.ledger.filter(l=>dayKey(l.ts)===key);
  const total=r2(sales.reduce((a,s)=>a+s.total,0));
  const profit=r2(sales.reduce((a,s)=>a+s.items.reduce((x,i)=>x+(i.cost!==null&&i.cost!==undefined?(i.price-i.cost)*i.qty:0),0),0));
  const cashSales=r2(sales.filter(s=>s.method==='cash').reduce((a,s)=>a+s.total,0));
  const paid=r2(led.filter(l=>l.type==='bayad'&&!l.ret).reduce((a,l)=>a+l.amount,0));
  const given=r2(led.filter(l=>l.type==='utang').reduce((a,l)=>a+l.amount,0)-led.filter(l=>l.dp).reduce((a,l)=>a+l.amount,0));
  const expd=r2(S.expenses.filter(e=>dayKey(e.ts)===key).reduce((a,e)=>a+e.amount,0));
  const top={};sales.forEach(s=>s.items.forEach(i=>{const k=i.name+'|'+(i.unit||'pc');top[k]=(top[k]||0)+i.qty}));
  const topList=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const days=[];for(let i=6;i>=0;i--){const ts=now-i*864e5,k=dayKey(ts);days.push({k,ts,v:r2(S.sales.filter(s=>dayKey(s.ts)===k).reduce((a,s)=>a+s.total,0))})}
  const max=Math.max(1,...days.map(d=>d.v));
  const label=isToday?t('today_w'):key===dayKey(now-864e5)?t('yesterday'):dateStr(new Date(key+'T12:00:00').getTime(),{weekday:'short',month:'short',day:'numeric'});
  const cname=id=>{const c=S.customers.find(c=>c.id===id);return c?c.name:'?'};
  return `<div class="daynav"><button class="sq" data-act="day" data-d="-1" aria-label="Previous day">‹</button><strong>${esc(label)}</strong><button class="sq" data-act="day" data-d="1" aria-label="Next day" ${isToday?'disabled style="opacity:.35"':''}>›</button></div>
  <div class="tiles">
    <div class="tile"><div class="k">${esc(t('sales'))}</div><div class="v">${peso(total)}</div></div>
    <div class="tile"><div class="k">${esc(t('profit'))}</div><div class="v">${peso(profit)}</div></div>
    <div class="tile"><div class="k">${esc(t('cash_in'))}</div><div class="v">${peso(cashSales+paid)}</div></div>
    <div class="tile"><div class="k">${esc(t('given_utang'))}</div><div class="v">${peso(given)}</div></div>
    <div class="tile"><div class="k">${esc(t('expenses'))}</div><div class="v">${peso(expd)}</div></div>
    <div class="tile"><div class="k">${esc(t('net_profit'))}</div><div class="v">${peso(profit-expd)}</div></div>
  </div>
  <div class="card"><h2 class="h2">${esc(t('last7'))}</h2><div class="bars">${days.map(d=>{const sel=d.k===key;return `<button data-act="pickday" data-k="${d.k}" aria-pressed="${sel}" aria-label="${esc(dateStr(d.ts)+' '+peso(d.v))}">${sel?`<em>${peso(d.v)}</em>`:''}<i style="height:${Math.max(3,Math.round(d.v/max*92))}%"></i><span>${new Date(d.ts).toLocaleDateString('en-PH',{weekday:'short'}).slice(0,3)}</span></button>`}).join('')}</div></div>
  ${topList.length?`<div class="card"><h2 class="h2" style="margin-bottom:8px">${esc(t('top_items'))}</h2>${topList.map(([k,q])=>{const [n,u]=k.split('|');return `<div class="line"><div class="ln"><b>${esc(n)}</b></div><div class="lt">${fq(q)}${u!=='pc'?' '+esc(u):'×'}</div></div>`}).join('')}</div>`:''}
  <div class="bar-actions"><h2 class="h2">${esc(t('sales_list'))}</h2></div>
  <div class="ledger">${sales.length?sales.map(s=>`<div class="sale"><div class="nm"><b>${peso(s.total)}</b> ${saleChip(s)}<small>${esc(timeStr(s.ts))} · ${esc(summary(s.items))}${s.cid?' · '+esc(t('on_utang_for',{name:cname(s.cid)})):''}</small></div><button class="link" data-act="sale-open" data-id="${esc(s.id)}">${esc(t('receipt_t'))}</button></div>`).join(''):`<div class="empty">${esc(t('no_sales'))}</div>`}</div>
  <p class="sub" style="margin-top:10px">${esc(t('profit_note'))}</p>`;

let toastT;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1800)}
function copyText(s){
  const done=()=>toast(t('copied'));
  try{navigator.clipboard.writeText(s).then(done,fallback)}catch(e){fallback()}
  function fallback(){const a=document.createElement('textarea');a.value=s;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()}
}
function setTab(k){if(isStaff()&&k==='records')k='sell';ui.tab=k;ui.rq='';ui.q='';ui.cat='';ui.low=false;ui.mapEdit=false;ui.sel=null;ui.mq='';if(location.hash!=='#'+k)try{history.replaceState(null,'','#'+k)}catch(e){}render();window.scrollTo(0,0)}

function newShape(kind,over){
  const k=KINDS[kind],n=S.map.shapes.filter(s=>s.kind===kind).length+1;
  const w=Math.min(k.w,S.map.w),h=Math.min(k.h,S.map.h);
  return Object.assign({id:uid(),kind,name:kindName(kind)+((kind==='door'||kind==='wall')?'':' '+n),w,h,
    x:clamp(snap(S.map.w/2-w/2+((n%4)-1.5)*.4),0,S.map.w-w),y:clamp(snap(S.map.h/2-h/2+((n%3)-1)*.4),0,S.map.h-h)},over||{});
}
function importPlan(file){
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const max=1400,sc=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      const old={bg:S.map.bg,h:S.map.h};
      S.map.bg=c.toDataURL('image/jpeg',.7);
      S.map.h=Math.max(2,Math.round(S.map.w*im.height/im.width*10)/10);
      if(!save()){S.map.bg=old.bg;S.map.h=old.h;toast(t('img_fail'));return}
      renderSheet();refreshMap(true);
    };
    im.onerror=()=>toast(t('img_fail'));
    im.src=String(fr.result);
  };
  fr.readAsDataURL(file);
}

  const rec={name,price,unit:$('#pu').value,cat:$('#pcat').value.trim(),cost:cv===''?null:r2(num(cv)),stock:sv===''?null:Math.max(0,r3(num(sv))),low:lv===''?5:Math.max(0,r3(num(lv))),loc:$('#ploc').value||null,spot:$('#pspot').value.trim(),supplier:$('#psup').value.trim(),barcode:$('#pbar').value.trim(),price2:(()=>{const v=r2(num($('#pp2').value));return v>0?v:null})(),parent:$('#ppar').value||null,per:Math.max(0,r3(num($('#pper').value)))};
  if(rec.parent&&!(rec.per>0)){$('#pper').focus();return}
  if(rec.parent){rec.stock=null;rec.low=0}else{rec.parent=null;rec.per=0}
  const sh=ui.sheet;
  if(rec.barcode){const dup=S.products.find(p=>p.barcode===rec.barcode&&p.id!==sh.id);if(dup){toast(t('bc_dup',{name:dup.name}));$('#pbar').focus();return}}
  if(sh.id){const pp=S.products.find(p=>p.id===sh.id),ob=pp.stock;Object.assign(pp,rec);if(rec.stock!==null&&rec.stock!==ob)logMove(pp,r3(rec.stock-(ob||0)),'adjust','')}
  else{const pp={id:uid(),...rec};S.products.push(pp);if(rec.stock)logMove(pp,rec.stock,'initial','')}
  save();closeSheet();renderMain();if(ui.tab==='map')refreshMap(true);toast(t('saved'));
},
'prod-del':()=>{
  const sh=ui.sheet;if(!sh.confirmDel){sh.confirmDel=true;renderSheet();return}
  S.products=S.products.filter(p=>p.id!==sh.id);ui.cart=ui.cart.filter(l=>l.pid!==sh.id);
  save();closeSheet();renderMain();renderCart();
},

void:d=>{if(d.armed==='1'){voidSale(d.id)}else{const b=document.querySelector(`[data-act="void"][data-id="${CSS.escape(d.id)}"]`);b.dataset.armed='1';b.textContent=t('confirm_delete')}},
'backup-copy':()=>copyText(JSON.stringify(S)),
'backup-dl':()=>{

},

reset:()=>{

/* map */

zoom:d=>{ui.zi=clamp(ui.zi+(+d.d),0,ZOOMS.length-1);renderMain()},
'shape-add':d=>{const s=newShape(d.k);S.map.shapes.push(s);ui.sel=s.id;save();refreshMap(true)},
'shape-open':d=>openSheet({type:'shape',id:d.id,mode:null,aq:''}),

},
'shape-dup':()=>{

},
'shape-del':()=>{

  S.map.shapes=S.map.shapes.filter(s=>s.id!==sh.id);ui.sel=null;save();closeSheet();refreshMap(true);
},
'assign-open':()=>{ui.sheet.mode='assign';ui.sheet.aq='';renderSheet(true)},
'assign-done':()=>{ui.sheet.mode=null;renderSheet();refreshMap(true)},
assign:d=>{const p=S.products.find(x=>x.id===d.id);if(!p)return;p.loc=ui.sheet.id;save();renderAssignList();toast(p.name)},
mapset:()=>openSheet({type:'mapset'}),
'mapset-save':()=>{
  const w=clamp(snap(num($('#mw').value))||S.map.w,2,100),h=clamp(snap(num($('#mh').value))||S.map.h,2,100);
  S.map.w=w;S.map.h=h;
  S.map.shapes.forEach(s=>{s.w=Math.min(s.w,w);s.h=Math.min(s.h,h);s.x=clamp(s.x,0,w-s.w);s.y=clamp(s.y,0,h-s.h)});

},
'img-remove':()=>{S.map.bg=null;save();renderSheet();refreshMap(true)}

function doRestock(n){const p=S.products.find(x=>x.id===ui.sheet.id);if(!p)return;p.stock=r3((p.stock||0)+n);logMove(p,n,'restock','');save();closeSheet();renderMain();toast('+'+fq(n)+' '+p.unit+' · '+p.name)}
function restore(txt){
  try{
    const d=JSON.parse(txt);
    if(!d||!Array.isArray(d.products)||!Array.isArray(d.customers)||!Array.isArray(d.ledger)||!Array.isArray(d.sales))throw 0;
    d.v=1;d.lang=d.lang||'en';d.shop=d.shop||DEF_SHOP;d.demo=!!d.demo;S=normalize(d);ui.cart=[];ui.sel=null;save();closeSheet();render();toast(t('restored'));
  }catch(e){toast(t('bad_backup'))}
}

function staffBanner(){return `<div class="banner" style="background:var(--green-bg);color:var(--green)"><span>${esc(t('staff_on'))}</span><button data-act="settings" style="background:var(--green);color:var(--card)">${esc(t('unlock'))}</button></div>`}

function logMove(p,qty,type,note,saleId){
  if(!qty)return;
  S.moves.push({id:uid(),ts:Date.now(),pid:p.id,name:p.name,unit:p.unit,qty:r3(qty),type,note:note||'',saleId:saleId||null});
  if(S.moves.length>8000)S.moves.splice(0,S.moves.length-8000);
}

/* ----- ranges ----- */
function rangeStart(){
  const now=Date.now(),r=ui.rrange;
  if(r==='today')return startOfDay(now);
  if(r==='7d')return startOfDay(now-6*864e5);
  if(r==='30d')return startOfDay(now-29*864e5);
  if(r==='month'){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).getTime()}
  return 0;
}
const rangeChips=()=>`<div class="catrow">${[['today','r_today'],['7d','r_7'],['30d','r_30'],['month','r_month'],['all','r_all']].map(([k,l])=>`<button class="pick" data-act="rrange" data-v="${k}" aria-pressed="${ui.rrange===k}">${esc(t(l))}</button>`).join('')}</div>`;
const custName=id=>{const c=S.customers.find(c=>c.id===id);return c?c.name:''};

/* ----- Records tab ----- */

function renderRList(){
  const el=$('#rlist');
  if(el)el.innerHTML=ui.rec==='sales'?salesList():ui.rec==='stock'?movesList():'';
  if(ui.rec==='close')closeSync();
}
function salesList(){
  const q=ui.rq.trim().toLowerCase(),st=rangeStart();
  const ss=S.sales.filter(s=>s.ts>=st&&(!ui.rpay||s.method===ui.rpay)&&(!q||(summary(s.items)+' '+custName(s.cid)).toLowerCase().includes(q))).sort((a,b)=>b.ts-a.ts);
  const total=r2(ss.reduce((a,s)=>a+s.total,0));
  let last='';
  const rows=ss.slice(0,150).map(s=>{
    const dk=dayKey(s.ts);let h='';
    if(dk!==last){last=dk;h=`<div class="dayh">${esc(dateStr(s.ts,{weekday:'short',month:'short',day:'numeric'}))}</div>`}
    return h+`<button class="lrow" data-act="sale-open" data-id="${esc(s.id)}"><span class="nm"><b>${peso(s.total)} ${saleChip(s)}</b><small>${esc(timeStr(s.ts))} · ${esc(summary(s.items))}${s.cid?' · '+esc(custName(s.cid)):''}</small></span><span class="amt">›</span></button>`;
  }).join('');
  return `<div class="tiles" style="margin-bottom:10px"><div class="tile"><div class="k">${esc(t('n_sales',{n:ss.length}))}</div><div class="v">${peso(total)}</div></div></div><button class="btn block" style="margin-bottom:10px" data-act="ret-free">${esc(t('ret_free'))}</button><div class="ledger">${rows||`<div class="empty">${esc(t('no_sales_r'))}</div>`}</div>`;
}

}
function closeHTML(){
  const key=ui.day,isT=key===dayKey(Date.now());
  const sales=S.sales.filter(s=>dayKey(s.ts)===key);
  const cashSales=r2(sales.filter(s=>s.method==='cash').reduce((a,s)=>a+s.total,0));
  const paid=r2(S.ledger.filter(l=>l.type==='bayad'&&!l.ret&&dayKey(l.ts)===key).reduce((a,l)=>a+l.amount,0));
  const exp=r2(S.expenses.filter(e=>dayKey(e.ts)===key).reduce((a,e)=>a+e.amount,0));
  const saved=S.closings.find(c=>c.day===key);
  const prev=S.closings.filter(c=>c.day<key).sort((a,b)=>a.day<b.day?1:-1)[0];
  const fl=saved?saved.float:(prev?prev.counted:0);
  const label=isT?t('today_w'):key===dayKey(Date.now()-864e5)?t('yesterday'):dateStr(new Date(key+'T12:00:00').getTime(),{weekday:'short',month:'short',day:'numeric'});
  const past=[...S.closings].sort((a,b)=>a.day<b.day?1:-1).slice(0,30);
  return `<div class="daynav"><button class="sq" data-act="day" data-d="-1" aria-label="Previous day">‹</button><strong>${esc(label)}</strong><button class="sq" data-act="day" data-d="1" aria-label="Next day" ${isT?'disabled style="opacity:.35"':''}>›</button></div>
  <div class="card" id="cbox" data-base="${r2(cashSales+paid-exp)}">
    <h2 class="h2" style="margin-bottom:10px">${esc(t('close_title'))}</h2>
    <label class="field"><span>${esc(t('float'))}</span><input id="cfloat" inputmode="decimal" autocomplete="off" value="${fl||''}" placeholder="0"></label>
    <div class="line"><div class="ln">${esc(t('cash'))} · ${esc(t('rec_sales'))}</div><div class="lt">+${peso(cashSales)}</div></div>
    <div class="line"><div class="ln">${esc(t('paid_back'))}</div><div class="lt">+${peso(paid)}</div></div>
    <div class="line"><div class="ln">${esc(t('expenses'))}</div><div class="lt">−${peso(exp)}</div></div>
    <div class="totalrow"><span>${esc(t('expected'))}</span><strong id="cexp"></strong></div>
    <label class="field"><span>${esc(t('counted'))}</span><input id="ccount" inputmode="decimal" autocomplete="off" value="${saved?saved.counted:''}"></label>
    <div class="change" id="cdiff"></div>
    <label class="field"><span>${esc(t('closing_note'))}</span><input id="cnote" autocomplete="off" value="${esc(saved?saved.note:'')}"></label>
    <button class="btn primary block" data-act="closing-save">${esc(t('save_closing'))}</button>
  </div>
  <div class="bar-actions"><h2 class="h2">${esc(t('past_closings'))}</h2></div>
  <div class="ledger">${past.length?past.map(c=>`<div class="sale"><div class="nm"><b>${esc(dateStr(new Date(c.day+'T12:00:00').getTime(),{weekday:'short',month:'short',day:'numeric'}))}</b><small>${esc(t('expected'))} ${peso(c.expected)} · ${esc(t('counted'))} ${peso(c.counted)}${c.note?' · '+esc(c.note):''}</small></div><span class="chip ${c.diff===0?'ok':'old'}">${c.diff===0?esc(t('balanced')):(c.diff>0?'+':'')+peso(c.diff)}</span></div>`).join(''):`<div class="empty">${esc(t('no_closings'))}</div>`}</div>`;
}
function closeSync(){
  const b=$('#cbox');if(!b)return;
  const base=+b.dataset.base,fl=num($('#cfloat').value),expd=r2(fl+base);

/* ----- Receipts and quotations ----- */
const infoLines=()=>[S.info.addr,S.info.phone,S.info.line].filter(Boolean);
const itemQtyTxt=i=>fq(Math.abs(i.qty))+(i.unit&&i.unit!=='pc'?' '+i.unit:'');
function docText(d){
  const isQ=d.kind==='quote',isR=!!d.ret;
  const L=[S.shop,...infoLines(),isQ?t('quotation'):isR?t('ret_slip'):t('receipt_t'),new Date(d.ts).toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'})];
  if(d.customer)L.push(t('customer_name')+': '+d.customer);
  L.push('------------------------');
  d.items.forEach(i=>{const p=i.lp||i.price,q=Math.abs(i.qty);L.push(itemQtyTxt(i)+' '+i.name+' @ '+peso(p)+' = '+peso(q*p))});
  L.push('------------------------');
  if(d.disc>0)L.push(t('subtotal')+': '+peso(d.sub),t('disc')+': -'+peso(d.disc));
  L.push((isR?t('ret_refund'):t('total'))+': '+peso(Math.abs(d.total)));
  if(d.down>0)L.push(t('rcpt_down')+': '+peso(d.down),t('rcpt_left')+': '+peso(d.total-d.down));
  if(isQ)L.push(t('valid_until',{d:dateStr(d.ts+(d.valid||7)*864e5,{month:'short',day:'numeric',year:'numeric'})}));
  else if(!isR)L.push(S.info.foot||t('thanks'));
  return L.join('\n');
}

  const d=ui.sheet,isQ=d.kind==='quote',isR=!!d.ret;
  const lines=d.items.map(i=>{const p=i.lp||i.price,q=Math.abs(i.qty);return `<div class="dl"><span>${esc(itemQtyTxt(i))} ${esc(i.name)}<small>@ ${peso(p)}</small></span><b>${peso(q*p)}</b></div>`}).join('');
  let actions;
  if(isQ&&d.quoteId)actions=`<button class="btn primary" data-act="quote-load">${esc(t('load_cart'))}</button><button class="btn ghost-red" data-act="quote-del">${esc(d.confirmDel?t('confirm_delete'):t('delete'))}</button>`;
  else if(isQ)actions=`<button class="btn primary" data-act="quote-save">${esc(t('save_quote'))}</button><button class="btn" data-act="close">${esc(t('close'))}</button>`;

const ITEM_COLS=['name','category','unit','price','cost','stock','low stock','location','spot','supplier','barcode','contractor price'];
const ALIAS={name:['name','item','itemname','product','productname','ngalan'],cat:['category','cat','type'],unit:['unit','uom'],price:['price','sellingprice','srp','presyo','retail'],cost:['cost','capital','puhunan','costprice'],stock:['stock','qty','quantity','onhand','stockonhand'],low:['low','lowstock','lowstocklevel','reorder','reorderlevel','min','minimum','warnat'],loc:['location','shelf','area','loc'],spot:['spot','bin','row','position'],supplier:['supplier','vendor'],barcode:['barcode','sku','code','upc'],price2:['contractorprice','contractor','wholesale','wholesaleprice','price2']};
const csvCell=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function parseCSV(text){
  text=String(text).replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const tabs=(first.match(/\t/g)||[]).length,semi=(first.match(/;/g)||[]).length,com=(first.match(/,/g)||[]).length;
  const delim=tabs?'\t':(semi>com?';':',');
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function dlFile(name,text,mime,bom){
  try{
    const b=new Blob([(bom===false?'':'﻿')+text],{type:mime||'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
    document.body.appendChild(a);a.click();a.remove();toast(name);
  }catch(e){copyText(text)}
}
function exportData(kind){
  const d=dayKey(Date.now()),loc=id=>{const s=shapeById(id);return s?s.name:''};
  const dt=ts=>dayKey(ts),tm=ts=>timeStr(ts);
  if(kind==='items')dlFile('arse-items-'+d+'.csv',toCSV([ITEM_COLS,...S.products.map(p=>[p.name,p.cat,p.unit,p.price,p.cost===null?'':p.cost,p.stock===null?'':p.stock,p.low,loc(p.loc),p.spot,p.supplier,p.barcode,p.price2>0?p.price2:''])]));
  else if(kind==='sales'){
    const rows=[['date','time','payment','customer','item','qty','unit','price','line total','sale total']];
    S.sales.slice().sort((a,b)=>a.ts-b.ts).forEach(s=>s.items.forEach(i=>rows.push([dt(s.ts),tm(s.ts),s.method,custName(s.cid),i.name,i.qty,i.unit||'pc',i.price,r2(i.qty*i.price),s.total])));
    dlFile('arse-sales-'+d+'.csv',toCSV(rows));
  }else if(kind==='stock')dlFile('arse-stock-log-'+d+'.csv',toCSV([['date','time','item','change','unit','type','note'],...S.moves.slice().sort((a,b)=>a.ts-b.ts).map(m=>[dt(m.ts),tm(m.ts),m.name,m.qty,m.unit,m.type,m.note])]));
  else if(kind==='ledger')dlFile('arse-utang-'+d+'.csv',toCSV([['date','customer','type','amount','note'],...S.ledger.slice().sort((a,b)=>a.ts-b.ts).map(l=>[dt(l.ts),custName(l.cid),l.type==='utang'?'utang':'payment',l.amount,l.note])]));
  else if(kind==='exp')dlFile('arse-expenses-'+d+'.csv',toCSV([['date','amount','category','note'],...S.expenses.slice().sort((a,b)=>a.ts-b.ts).map(e=>[dt(e.ts),e.amount,e.cat,e.note])]));
  else dlFile('arse-backup-'+d+'.json',JSON.stringify(S,null,1),'application/json',false);
}
function runImport(text){
  const rows=parseCSV(text);if(rows.length<2)return null;
  const nz=h=>String(h).toLowerCase().replace(/[^a-z0-9]/g,'');
  const idx={};
  rows[0].forEach((h,i)=>{const n=nz(h);for(const k in ALIAS)if(idx[k]===undefined&&ALIAS[k].includes(n))idx[k]=i});
  if(idx.name===undefined)return null;
  const clean=s=>num(String(s).replace(/[₱\s]/g,'').replace(/,(?=\d{3}(\D|$))/g,''));
  let a=0,u=0,sk=0;
  rows.slice(1).forEach(r=>{
    const g=k=>idx[k]===undefined?'':String(r[idx[k]]==null?'':r[idx[k]]).trim();
    const name=g('name');if(!name){sk++;return}
    const bc=g('barcode');
    const p=(bc&&S.products.find(x=>x.barcode===bc))||S.products.find(x=>x.name.toLowerCase()===name.toLowerCase());
    const lq=g('loc').toLowerCase();
    const shape=lq?(S.map.shapes.find(s=>s.name.toLowerCase()===lq)||S.map.shapes.find(s=>s.name.toLowerCase().includes(lq))):null;
    const rec={name};
    if(g('cat'))rec.cat=g('cat');
    if(g('unit'))rec.unit=g('unit');
    if(g('price'))rec.price=r2(clean(g('price')));
    if(g('cost'))rec.cost=r2(clean(g('cost')));
    if(g('price2'))rec.price2=r2(clean(g('price2')));
    if(g('stock'))rec.stock=Math.max(0,r3(clean(g('stock'))));
    if(g('low'))rec.low=Math.max(0,r3(clean(g('low'))));
    if(shape)rec.loc=shape.id;
    if(g('spot'))rec.spot=g('spot');
    if(g('supplier'))rec.supplier=g('supplier');
    if(bc)rec.barcode=bc;
    if(p){
      const before=p.stock;Object.assign(p,rec);
      if(rec.stock!==undefined&&rec.stock!==before)logMove(p,r3(rec.stock-(before||0)),'import','');
      u++;
    }else{
      if(!(rec.price>0)){sk++;return}
      const np=Object.assign({id:uid(),unit:'pc',cat:'',price:0,cost:null,stock:null,low:5,loc:null,spot:'',supplier:'',barcode:'',price2:null,parent:null,per:0},rec);
      S.products.push(np);if(np.stock)logMove(np,np.stock,'import','');a++;
    }
  });
  save();return {a,u,s:sk};
}
function doImport(text){
  const r=runImport(text),el=$('#ires');
  if(!r){if(el)el.textContent=t('import_none');return}
  if(el)el.textContent=t('import_done',{a:r.a,u:r.u,s:r.s});
  renderMain();toast(t('import_done',{a:r.a,u:r.u,s:r.s}));
}

let scanner=null,lastScan={c:'',t:0};
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
async function loadScanner(){
  if(window.Html5Qrcode)return;
  try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js')}
  catch(e){await loadScript('https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js')}
}
async function startScan(){
  try{
    await loadScanner();
    if(!ui.sheet||ui.sheet.type!=='scan')return;
    scanner=new Html5Qrcode('scanbox');
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150}},code=>onBarcode(code),()=>{});
  }catch(e){const el=$('#scanerr');if(el)el.textContent=t('scan_fail');scanner=null}
}
async function stopScan(){const s=scanner;scanner=null;if(!s)return;try{await s.stop()}catch(e){}try{s.clear()}catch(e){}}
function onBarcode(code){
  code=String(code).trim();const now=Date.now();
  if(!code||(code===lastScan.c&&now-lastScan.t<2500))return;
  lastScan={c:code,t:now};
  const sh=ui.sheet;if(!sh||sh.type!=='scan')return;
  if(sh.target==='product'){stopScan();openSheet(Object.assign({},sh.back,{draft:Object.assign({},sh.back.draft,{barcode:code})}));return}
  useBarcode(code);
}
function useBarcode(code){
  const p=S.products.find(x=>x.barcode&&x.barcode===code);
  if(!p){toast(t('scan_none')+' ('+code+')');return}
  const av0=availOf(p);if(av0!==null&&av0<=0){toast(t('out')+': '+p.name);return}
  addToCart(p.id);toast(t('scan_added',{name:p.name}));
}

/* ----- Insights: plain-language analysis of the store's own numbers ----- */
function periodBounds(){
  if(ui.pbo)return ui.pbo;
  const now=Date.now(),r=ui.rrange,a=rangeStart(),b=now+1;let pa=null,pb=null;
  if(r==='today'){pa=startOfDay(now-864e5);pb=a}
  else if(r==='month'){const d=new Date();pa=new Date(d.getFullYear(),d.getMonth()-1,1).getTime();pb=a}
  else if(r!=='all'){const len=b-a;pa=a-len;pb=a}
  return {a,b,pa,pb};
}
function periodStats(a,b){
  const ss=S.sales.filter(s=>s.ts>=a&&s.ts<b);
  let sales=0,profit=0,costed=0,utangSales=0;
  ss.forEach(s=>{sales+=s.total;if(s.method==='utang')utangSales+=s.total;s.items.forEach(i=>{if(i.cost!==null&&i.cost!==undefined){profit+=(i.price-i.cost)*i.qty;costed+=i.price*i.qty}})});
  const exp=S.expenses.filter(e=>e.ts>=a&&e.ts<b).reduce((x,e)=>x+e.amount,0);
  const nS=ss.filter(x=>!x.ret).length;
  return {ss,n:nS,sales:r2(sales),profit:r2(profit),margin:costed>0?profit/costed*100:null,exp:r2(exp),net:r2(profit-exp),avg:nS?r2(sales/nS):0,utangShare:sales>0?utangSales/sales*100:0};
}
const dchip=(c,p)=>{if(!(p>0))return '';const d=Math.round((c-p)/p*100);if(d===0)return `<small class="dchip">= ${esc(t('ins_same'))}</small>`;return `<small class="dchip ${d>0?'up':'dn'}">${d>0?'▲':'▼'} ${Math.abs(d)}%</small>`};
function insightsCalc(){
  const {a,b,pa,pb}=periodBounds(),now=Date.now();
  const firstTs=S.sales.length?Math.min(...S.sales.map(s=>s.ts)):now;
  const cur=periodStats(a,b),prev=pa!==null?periodStats(pa,pb):null,hasPrev=!!(prev&&prev.n>0&&firstTs<=pa+(pb-pa)*.25);
  if(cur.n<3)return {nodata:true,cur,prev,hasPrev,a,b,F:[],v:null,rows:[],top:[]};
  const F=[],add=(lvl,msg,tip)=>F.push({lvl,msg,tip:tip||''}),names=arr=>arr.slice(0,3).join(', ');
  // 1 sales trend
  if(hasPrev&&prev.sales>0){
    const d=Math.round((cur.sales-prev.sales)/prev.sales*100);
    if(d>=5)add('good',t('f_sales_up',{p:d}),t('tip_sales_up'));
    else if(d<=-20)add('bad',t('f_sales_down',{p:-d}),t('tip_sales_down'));
    else if(d<=-5)add('warn',t('f_sales_down',{p:-d}),t('tip_sales_down'));
    else add('info',t('f_sales_flat'),t('tip_sales_flat'));
  }
  // 2 margin
  if(cur.margin!==null){
    const m=Math.round(cur.margin*10)/10;
    if(m<10)add('bad',t('f_margin_bad',{p:m}),t('tip_margin'));
    else if(m<18)add('warn',t('f_margin_warn',{p:m}),t('tip_margin'));
    else add('good',t('f_margin_good',{p:m}));
  }
  // 3 expenses and net
  if(cur.exp>0||cur.profit>0){
    if(cur.net<0)add('bad',t('f_net_bad',{e:peso(cur.exp),g:peso(cur.profit)}),t('tip_exp'));
    else if(cur.profit>0&&cur.exp/cur.profit>.6)add('warn',t('f_net_warn',{p:Math.round(cur.exp/cur.profit*100)}),t('tip_exp'));
    else add('good',t('f_net_good',{n:peso(cur.net)}));
  }
  // 4 utang
  const overdue=S.customers.filter(c=>bal(c.id)>0&&daysSincePay(c)>30);
  if(overdue.length)add('warn',t('f_overdue',{n:overdue.length,a:peso(overdue.reduce((x,c)=>x+bal(c.id),0))}),t('tip_overdue'));
  if(cur.utangShare>=35)add('warn',t('f_share_warn',{p:Math.round(cur.utangShare)}),t('tip_share'));
  else add('good',t('f_share_ok',{p:Math.round(cur.utangShare)}));
  // 5 stock
  const soldQty={};cur.ss.forEach(s=>s.items.forEach(i=>{if(i.pid)soldQty[i.pid]=(soldQty[i.pid]||0)+i.qty}));
  const outSelling=S.products.filter(p=>p.stock!==null&&p.stock<=0&&soldQty[p.id]).sort((x,y)=>soldQty[y.id]-soldQty[x.id]).map(p=>p.name);
  if(outSelling.length)add('warn',t('f_out',{names:names(outSelling)}),t('tip_out'));
  const lowN=S.products.filter(lowOf).length;
  if(lowN)add('info',t('f_low',{n:lowN}),t('tip_low'));
  // 6 slow movers (needs about 2 weeks of history)
  if(Math.floor((now-firstTs)/864e5)>=14){
    const sold=new Set();S.sales.forEach(s=>{if(s.ts>=now-30*864e5)s.items.forEach(i=>{if(i.pid)sold.add(i.pid)})});
    const dead=S.products.filter(p=>p.stock>0&&!sold.has(p.id)).map(p=>({n:p.name,c:(p.cost||0)*p.stock})).sort((x,y)=>y.c-x.c);
    if(dead.length)add('warn',t('f_dead',{n:dead.length,a:peso(dead.reduce((x,d)=>x+d.c,0)),names:names(dead.map(d=>d.n))}),t('tip_dead'));
  }else add('info',t('f_dead_wait'));
  // 7 best sellers with thin margin
  const agg={};
  cur.ss.forEach(s=>s.items.forEach(i=>{const k=i.name+'|'+(i.unit||'pc'),o=agg[k]||(agg[k]={n:i.name,u:i.unit||'pc',rev:0,pr:0,qty:0,costed:0});o.rev+=i.price*i.qty;o.qty+=i.qty;if(i.cost!==null&&i.cost!==undefined){o.pr+=(i.price-i.cost)*i.qty;o.costed+=i.price*i.qty}}));
  const rows=Object.values(agg);
  const thin=rows.filter(o=>o.costed>0).sort((x,y)=>y.rev-x.rev).slice(0,5).filter(o=>o.pr/o.costed<.1).map(o=>o.n);
  if(thin.length)add('warn',t('f_thin',{names:names(thin)}),t('tip_thin'));
  // 8 cash short at closing
  const shorts=S.closings.filter(c=>c.day>=dayKey(a)&&c.diff<0);
  if(shorts.length)add('warn',t('f_cash_short',{n:shorts.length,a:peso(-shorts.reduce((x,c)=>x+c.diff,0))}),t('tip_cash'));
  // 9 costs missing
  const noCost=S.products.filter(p=>p.cost===null).length;
  if(noCost)add('info',t('f_nocost',{n:noCost}),t('tip_nocost'));
  // 10 busiest day and hour
  if(cur.n>=10){
    const wd={},hr={};cur.ss.forEach(s=>{const d=new Date(s.ts);wd[d.getDay()]=(wd[d.getDay()]||0)+s.total;hr[d.getHours()]=(hr[d.getHours()]||0)+s.total});
    const best=o=>Object.keys(o).sort((x,y)=>o[y]-o[x])[0];
    const dn=new Date(2024,0,7+(+best(wd))).toLocaleDateString('en-PH',{weekday:'long'});
    const hh=new Date(2024,0,1,+best(hr)).toLocaleTimeString('en-PH',{hour:'numeric'});
    add('info',t('f_busy',{d:dn,h:hh}));
  }
  const nb=F.filter(f=>f.lvl==='bad').length,nw=F.filter(f=>f.lvl==='warn').length;
  const v=nb?'bad':nw>=3?'mixed':'good';
  const top=rows.filter(o=>o.costed>0).sort((x,y)=>y.pr-x.pr).slice(0,5);
  return {cur,prev,hasPrev,F,v,rows,top,a,b};
}
function insightsHTML(){
  const head=rangeChips(),R=insightsCalc();
  if(R.nodata)return head+`<div class="empty">${esc(t('ins_nodata'))}</div>`;
  const {cur,prev,hasPrev,F,v,top}=R;
  const verdict=`<div class="sign"><div class="k">${esc(t('ins_title'))}</div><div class="big" style="font-size:26px">${esc(t('ins_'+v))}</div><div class="s">${esc(t('ins_'+v+'_s'))}</div></div>`;
  const tile=(k,val,ch)=>`<div class="tile"><div class="k">${esc(t(k))}</div><div class="v">${val}</div>${ch||''}</div>`;
  const P=hasPrev?prev:null;
  const tiles=`<div class="tiles">${tile('sales',peso(cur.sales),P&&dchip(cur.sales,P.sales))}${tile('profit',peso(cur.profit),P&&dchip(cur.profit,P.profit))}${tile('net_profit',peso(cur.net),P&&dchip(cur.net,P.net))}${tile('margin',cur.margin===null?'—':(Math.round(cur.margin*10)/10)+'%','')}${tile('ins_avg',peso(cur.avg),P&&dchip(cur.avg,P.avg))}${tile('ins_count',String(cur.n),P&&dchip(cur.n,P.n))}</div>${hasPrev?`<p class="sub" style="margin:-6px 0 12px">${esc(t('ins_vs'))}</p>`:`<p class="sub" style="margin:-6px 0 12px">${esc(t('ins_noprev'))}</p>`}`;
  const list=`<div class="bar-actions"><h2 class="h2">${esc(t('ins_findings'))}</h2></div>${findingsHTML(F)}`;
  const topH=top.length?`<div class="card" style="margin-top:14px"><h2 class="h2" style="margin-bottom:8px">${esc(t('ins_top'))}</h2>${top.map(o=>`<div class="line"><div class="ln"><b>${esc(o.n)}</b><small>${fq(o.qty)}${o.u!=='pc'?' '+esc(o.u):'×'} · ${esc(t('sales'))} ${peso(o.rev)}</small></div><div class="lt" style="color:var(--green)">${peso(o.pr)}</div></div>`).join('')}</div>`:'';
  return head+verdict+tiles+list+topH+`<p class="sub" style="margin-top:12px">${esc(t('ins_note'))}</p>`;
}

const C128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function code128(text){
  text=String(text);if(!text)return null;
  const vals=[];
  if(/^\d+$/.test(text)&&text.length%2===0){vals.push(105);for(let i=0;i<text.length;i+=2)vals.push(+text.slice(i,i+2))}
  else{vals.push(104);for(const ch of text){const c=ch.charCodeAt(0);if(c<32||c>126)return null;vals.push(c-32)}}
  let sum=vals[0];for(let i=1;i<vals.length;i++)sum+=vals[i]*i;
  vals.push(sum%103,106);
  return vals.map(v=>C128[v]).join('');
}
function barcodeSVG(text){
  const w=code128(text);if(!w)return '';
  let x=10,bar=true,d='';
  for(const ch of w){const n=+ch;if(bar)d+='M'+x+' 0h'+n+'v40h-'+n+'z';x+=n;bar=!bar}
  return `<svg class="bc" viewBox="0 0 ${x+10} 40" preserveAspectRatio="none" role="img" aria-label="${esc(text)}" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
}
function nextCode(){
  let m=0;S.products.forEach(p=>{if(/^29\d{6}$/.test(p.barcode||''))m=Math.max(m,+p.barcode.slice(2))});
  const n=Math.max(+S.bcNext||1,m+1);S.bcNext=n+1;
  return '29'+String(n).padStart(6,'0');
}

/* ----- Receive delivery ----- */
function rvNewCost(p,qty,cost,mode){
  if(!(cost>0))return p.cost;
  const old=p.stock||0;
  if(mode==='last'||p.cost===null||!(old>0))return r2(cost);
  return r2((old*p.cost+qty*cost)/(old+qty));
}

function rvRes(){

  const ps=S.products.filter(p=>matchP(p,q)&&!sh.lines.some(l=>l.pid===p.id)).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,6);

function rvSync(){
  const sh=ui.sheet;if(!sh||sh.type!=='receive')return;
  let tot=0;
  sh.lines.forEach((l,i)=>{
    const p=S.products.find(x=>x.id===l.pid),q=num(l.qty),c=num(l.cost);tot+=q*c;
    const el=$('#rvnc'+i);if(!el||!p)return;
    el.textContent=(q>0&&c>0)?t('rv_newcost',{c:peso(rvNewCost(p,q,c,sh.mode))})+' · '+peso(q*c):'';
  });
  const e=$('#rvtot');if(e)e.textContent=peso(tot);
}
function rvAdd(p,qty,cost){
  const sh=ui.sheet;if(sh.lines.some(l=>l.pid===p.id))return;
  sh.lines.push({pid:p.id,name:p.name,unit:p.unit,qty:qty===undefined?'':qty,cost:cost===undefined?(p.cost===null?'':p.cost):cost});
}
function deliveryText(d){

}

/* ----- Monthly report ----- */
const monthKey=ts=>dayKey(ts).slice(0,7);
const monthLabel=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-PH',{month:'long',year:'numeric'})};
function monthBounds(k){
  const [y,m]=k.split('-').map(Number),a=new Date(y,m-1,1).getTime(),e=new Date(y,m,1).getTime();
  const b=Math.min(e,Date.now()+1),pa=new Date(y,m-2,1).getTime();
  return {a,b,pa,pb:Math.min(a,pa+(b-a)),e};
}
function reportData(k){
  const bd=monthBounds(k);
  ui.pbo={a:bd.a,b:bd.b,pa:bd.pa,pb:bd.pb};
  let R;try{R=insightsCalc()}finally{ui.pbo=null}
  const cur=R.cur,inM=ts=>ts>=bd.a&&ts<bd.b;
  const ndays=Math.round((Math.min(bd.e,startOfDay(Date.now())+864e5)-bd.a)/864e5);
  const days=[];for(let i=0;i<ndays;i++)days.push(0);
  cur.ss.forEach(s=>{const i=Math.floor((startOfDay(s.ts)-bd.a)/864e5);if(i>=0&&i<days.length)days[i]+=s.total});
  const best=days.length&&Math.max(...days)>0?days.indexOf(Math.max(...days)):-1;
  const cats={};
  cur.ss.forEach(s=>s.items.forEach(i=>{const p=i.pid&&S.products.find(x=>x.id===i.pid),c=(p&&p.cat)||'Other';cats[c]=(cats[c]||0)+i.price*i.qty}));
  const catList=Object.entries(cats).sort((x,y)=>y[1]-x[1]);
  const ex={};S.expenses.filter(e=>inM(e.ts)).forEach(e=>{const c=e.cat||'Other';ex[c]=(ex[c]||0)+e.amount});
  const exList=Object.entries(ex).sort((x,y)=>y[1]-x[1]);
  const given=r2(S.ledger.filter(l=>l.type==='utang'&&inM(l.ts)).reduce((a,l)=>a+l.amount,0)-S.ledger.filter(l=>l.dp&&inM(l.ts)).reduce((a,l)=>a+l.amount,0));
  const collected=r2(S.ledger.filter(l=>l.type==='bayad'&&!l.ret&&inM(l.ts)).reduce((a,l)=>a+l.amount,0));
  const owed=r2(S.customers.reduce((a,c)=>a+Math.max(0,bal(c.id)),0));
  const purchases=r2(S.deliveries.filter(d=>inM(d.ts)).reduce((a,d)=>a+d.total,0));
  const shorts=S.closings.filter(c=>inM(new Date(c.day+'T12:00:00').getTime())&&c.diff<0);
  const items={};
  cur.ss.forEach(s=>s.items.forEach(i=>{const kk=i.name+'|'+(i.unit||'pc'),o=items[kk]||(items[kk]={n:i.name,u:i.unit||'pc',qty:0,rev:0,pr:0});o.qty+=i.qty;o.rev+=i.price*i.qty;if(i.cost!==null&&i.cost!==undefined)o.pr+=(i.price-i.cost)*i.qty}));
  const topItems=Object.values(items).sort((x,y)=>y.rev-x.rev).slice(0,10);
  return {k,bd,R,cur,days,best,catList,exList,given,collected,owed,purchases,shorts,topItems};
}

  ${imp.length?`<div class="bar-actions"><h2 class="h2">${esc(t('rpt_improve'))}</h2></div><div class="ledger" style="margin-bottom:12px">${fl(imp)}</div>`:''}

  <p class="sub" style="margin-top:12px">${esc(t('ins_note'))}</p></div>`;

  const D=reportData(k),{R,cur}=D,L=[S.shop,...infoLines(),t('rpt_title')+' - '+monthLabel(k),'------------------------'];
  if(!cur.n){L.push(t('rpt_none'));return L.join('\n')}
  L.push(t('sales')+': '+peso(cur.sales),t('profit')+': '+peso(cur.profit),t('expenses')+': '+peso(cur.exp),t('net_profit')+': '+peso(cur.net));

/* ----- Cloud backup to Google Drive (via a small Google Apps Script) ----- */
const CLOUD_LS='hardware-tracker.cloud';
let cloud=(()=>{try{return Object.assign({url:'',key:'',auto:true,last:0,msg:''},JSON.parse(localStorage.getItem(CLOUD_LS))||{})}catch(e){return {url:'',key:'',auto:true,last:0,msg:''}}})();
const cloudSave=()=>{try{localStorage.setItem(CLOUD_LS,JSON.stringify(cloud))}catch(e){}};
let cloudBusy=false;
const cloudOn=()=>!!(cloud.url&&cloud.key);
async function cloudCall(body){
  const r=await fetch(cloud.url,{method:'POST',body:JSON.stringify(Object.assign({key:cloud.key},body))});
  const j=await r.json();
  if(!j||!j.ok)throw new Error((j&&j.error)||'failed');
  return j;
}
async function cloudBackup(manual){
  if(cloudBusy||!cloudOn())return false;
  cloudBusy=true;
  try{
    await cloudCall({action:'backup',data:JSON.stringify(S)});
    cloud.last=Date.now();cloud.msg='';cloudDirty=false;cloudSave();
    if(manual)toast(t('cb_done'));
    return true;
  }catch(e){cloud.msg=String(e&&e.message||e);cloudSave();if(manual)toast(t('cb_fail')+': '+cloud.msg);return false}
  finally{cloudBusy=false;if(ui.sheet&&ui.sheet.type==='cloud')renderSheet()}
}
function cloudTick(){
  if(cloud.auto&&cloudOn()&&cloudDirty&&Date.now()-cloud.last>3600e3&&navigator.onLine!==false)cloudBackup(false);
}
setInterval(cloudTick,5*60e3);
document.addEventListener('visibilitychange',cloudTick);
window.addEventListener('online',cloudTick);
setTimeout(cloudTick,4000);
async function cloudRestore(){
  const sh=ui.sheet;
  if(!sh.armRestore){sh.armRestore=true;renderSheet();return}
  try{
    const u=cloud.url+(cloud.url.indexOf('?')>=0?'&':'?')+'key='+encodeURIComponent(cloud.key)+'&action=latest';
    const r=await fetch(u),j=await r.json();
    if(!j||!j.ok)throw new Error((j&&j.error)||'failed');
    try{localStorage.setItem('hardware-tracker.before-restore',JSON.stringify(S))}catch(e){}
    restore(j.data);

const CLOUD_SCRIPT="// ARSE STORE cloud backup (Google Apps Script)\n// 1) Set KEY below to the same secret key shown in the app.\n// 2) Deploy > New deployment > Web app > Execute as: Me, Who has access: Anyone.\nvar KEY = '__KEY__';\nvar FOLDER_ID = '__FOLDER__'; // folder for the backups; if empty or not found, a folder named \"ARSE STORE Backups\" is used\nvar KEEP = 30; // how many daily backup files to keep\n\nfunction folder_() {\n  if (FOLDER_ID) { try { return DriveApp.getFolderById(FOLDER_ID); } catch (e) {} }\n  var it = DriveApp.getFoldersByName('ARSE STORE Backups');\n  return it.hasNext() ? it.next() : DriveApp.createFolder('ARSE STORE Backups');\n}\nfunction out_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction put_(folder, name, text) {\n  var it = folder.getFilesByName(name);\n  if (it.hasNext()) it.next().setContent(text);\n  else folder.createFile(name, text, 'application/json');\n}\nfunction prune_(folder) {\n  var files = [], it = folder.getFiles();\n  while (it.hasNext()) {\n    var f = it.next();\n    if (/^arse-backup-\\d{4}-\\d{2}-\\d{2}\\.json$/.test(f.getName())) files.push(f);\n  }\n  files.sort(function (a, b) { return a.getName() < b.getName() ? 1 : -1; });\n  for (var i = KEEP; i < files.length; i++) files[i].setTrashed(true);\n}\nfunction doPost(e) {\n  try {\n    var b = JSON.parse(e.postData.contents);\n    if (b.key !== KEY) return out_({ ok: false, error: 'wrong key' });\n    if (b.action === 'ping') return out_({ ok: true });\n    if (b.action === 'backup') {\n      if (!b.data) return out_({ ok: false, error: 'no data' });\n      var f = folder_();\n      var day = Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd');\n      var name = 'arse-backup-' + day + '.json';\n      put_(f, name, b.data);\n      put_(f, 'arse-backup-latest.json', b.data);\n      prune_(f);\n      return out_({ ok: true, file: name, ts: new Date().getTime() });\n    }\n  } catch (err) {\n    return out_({ ok: false, error: String(err) });\n  }\n  return out_({ ok: false, error: 'unknown action' });\n}\nfunction doGet(e) {\n  var p = (e && e.parameter) || {};\n  if (p.key !== KEY) return out_({ ok: false, error: 'wrong key' });\n  if (p.action === 'ping') return out_({ ok: true });\n  if (p.action === 'latest') {\n    var it = folder_().getFilesByName('arse-backup-latest.json');\n    if (!it.hasNext()) return out_({ ok: false, error: 'no backup yet' });\n    var f = it.next();\n    return out_({ ok: true, ts: f.getLastUpdated().getTime(), data: f.getBlob().getDataAsString() });\n  }\n  return out_({ ok: false, error: 'unknown action' });\n}\n";

const tierPrice=p=>(ui.tier==='contractor'&&p.price2>0)?p.price2:p.price;
const parentOf=p=>p.parent?S.products.find(x=>x.id===p.parent):null;
const availOf=p=>{const pr=parentOf(p);if(pr&&p.per>0){return pr.stock===null?null:Math.max(0,Math.floor(r3(pr.stock*p.per)+1e-9))}return p.stock};
function takeStock(p,qty,type,note,saleId){
  const pr=parentOf(p);
  if(pr&&p.per>0){if(pr.stock===null)return;const d=r3(qty/p.per);pr.stock=Math.max(0,r3(pr.stock-d));logMove(pr,-d,type,(note?note+' · ':'')+fq(Math.abs(qty))+' '+p.unit+' '+p.name,saleId);return}
  if(p.stock===null)return;
  p.stock=Math.max(0,r3(p.stock-qty));logMove(p,-qty,type,note||'',saleId);
}

function dueInfo(c){
  const L=S.ledger.filter(l=>l.cid===c.id).sort((a,b)=>a.ts-b.ts);
  let pay=L.filter(l=>l.type==='bayad').reduce((a,l)=>a+l.amount,0),next=null,over=0;
  for(const l of L){
    if(l.type!=='utang')continue;
    const use=Math.min(l.amount,pay);pay-=use;const rem=l.amount-use;
    if(rem>.004&&l.due){if(next===null||l.due<next)next=l.due;if(l.due<Date.now())over+=rem}
  }
  return {next,over:r2(over)};
}
function dueChip(c){

  const n=Math.floor((Date.now()-d.next)/864e5);
  return d.next<Date.now()?`<span class="chip out">${esc(t('overdue_chip',{n:Math.max(1,n)}))}</span>`:`<span class="chip ${d.next-Date.now()<=7*864e5?'low':'ok'}">${esc(t('due_chip',{d:dateStr(d.next,{month:'short',day:'numeric'})}))}</span>`;
}

}

function recordSale(){
  const sh=ui.sheet;
  ui.cart=ui.cart.filter(l=>l.qty>0);
  if(!ui.cart.length)return;
  const sub=cartSub(),disc=discOf(sub),total=r2(sub-disc);let cid=null,down=0,due=null;
  if(sh.method==='utang'){
    if(sh.cid)cid=sh.cid;
    else if(sh.newName.trim()){const c={id:uid(),name:sh.newName.trim(),phone:'',tier:'retail',limit:0,terms:0};S.customers.push(c);cid=c.id}
    else return;
    down=r2(Math.min(Math.max(num(sh.down),0),total));due=dueTs(sh.due);
  }
  const f=(sub>0&&disc>0)?total/sub:1;
  const items=ui.cart.map(l=>{const it={pid:l.pid,name:l.name,unit:l.unit||'pc',qty:l.qty,price:f===1?l.price:Math.round(l.price*f*10000)/10000,cost:l.cost};if(f!==1)it.lp=l.price;return it});
  const sale={id:uid(),ts:Date.now(),items,total,method:sh.method,cid};
  if(disc>0){sale.sub=sub;sale.disc=disc}
  if(down>0)sale.down=down;
  if(ui.tier==='contractor')sale.tier='contractor';
  ui.cart.forEach(l=>{const p=l.pid&&S.products.find(p=>p.id===l.pid);if(p)takeStock(p,l.qty,'sale','',sale.id)});
  S.sales.push(sale);
  if(cid){
    const led={id:uid(),cid,type:'utang',amount:total,note:summary(items),ts:sale.ts,saleId:sale.id};if(due)led.due=due;S.ledger.push(led);
    if(down>0)S.ledger.push({id:uid(),cid,type:'bayad',amount:down,note:t('down_note'),ts:sale.ts,saleId:sale.id,dp:true});
  }
  if(ui.orderRef&&ui.cart.some(l=>String(l.key).startsWith('ord:'))){const o=S.orders.find(x=>x.id===ui.orderRef);if(o){o.status='done';o.saleId=sale.id;o.doneTs=Date.now()}ui.orderRef=null}
  ui.orderRef=null;ui.cart=[];ui.tier='retail';closeSheet();save();render();toast(t('sale_saved')+' · '+peso(total));
}

  return `<h3 class="sh-title">${esc(o?t('ord_title_t'):t('ord_new'))}</h3>
  <div class="seg" style="display:flex;margin-bottom:12px" role="group"><button style="flex:1;min-height:44px" data-act="ord-kind" data-v="delivery" aria-pressed="${d.kind==='delivery'}">${esc(t('ord_kind_d'))}</button><button style="flex:1;min-height:44px" data-act="ord-kind" data-v="pickup" aria-pressed="${d.kind==='pickup'}">${esc(t('ord_kind_p'))}</button></div>
  ${cs.length?`<div class="chips">${cs.map(c=>`<button class="pick" data-act="ord-cust" data-id="${esc(c.id)}" aria-pressed="${d.cid===c.id}">${esc(c.name)}</button>`).join('')}</div>`:''}
  <div class="row2"><label class="field"><span>${esc(t('ord_name'))}</span><input id="oname" autocomplete="off" value="${esc(d.name)}" data-in="oname"></label><label class="field"><span>${esc(t('phone'))}</span><input id="ophone" inputmode="tel" autocomplete="off" value="${esc(d.phone)}" data-in="ophone"></label></div>
  ${d.kind==='delivery'?`<label class="field"><span>${esc(t('ord_addr'))}</span><input id="oaddr" autocomplete="off" value="${esc(d.addr)}" data-in="oaddr"></label>`:''}
  <div class="row2"><label class="field"><span>${esc(t('ord_when'))}</span><input id="owhen" type="datetime-local" value="${esc(d.when)}" data-in="owhen"></label>${d.kind==='delivery'?`<label class="field"><span>${esc(t('ord_fee'))}</span><input id="ofee" inputmode="decimal" autocomplete="off" value="${esc(d.fee)}" data-in="ofee"></label>`:''}</div>
  <label class="field"><span>${esc(t('ord_note'))}</span><input id="onote" autocomplete="off" value="${esc(d.note)}" data-in="onote"></label>
  <div class="card" style="padding:8px 12px;margin:0 0 10px">${items.map(i=>`<div class="line"><div class="ln"><b>${esc(i.name)}</b><small>${fq(i.qty)}${i.unit&&i.unit!=='pc'?' '+esc(i.unit):''} × ${peso(i.price)}</small></div><div class="lt">${peso(i.qty*i.price)}</div></div>`).join('')}${d.kind==='delivery'&&fee>0?`<div class="line"><div class="ln">${esc(t('ord_fee_line'))}</div><div class="lt">${peso(fee)}</div></div>`:''}</div>
  <div class="totalrow"><span>${esc(t('ord_total'))}</span><strong id="ototal">${peso(d.kind==='delivery'?total:r2(total-fee))}</strong></div>
  ${stBtns}
  ${o&&o.status!=='done'?`<button class="btn primary block" data-act="order-complete">${esc(t('ord_complete'))}</button>`:''}
  <div class="row2" style="margin-top:10px"><button class="btn" data-act="${o?'orders':'close'}">${esc(o?t('back'):t('cancel'))}</button><button class="btn ${o?'':'primary'}" data-act="order-save">${esc(t('ord_save'))}</button></div>
  ${o?`<div class="row2" style="margin-top:10px"><button class="btn" data-act="order-copy">${esc(t('ord_copy'))}</button>${isStaff()?'':`<button class="btn ghost-red" data-act="order-del">${esc(sh.confirmDel?t('confirm_delete'):t('delete'))}</button>`}</div>`:''}`;
}
function ordFromSheet(){
  const sh=ui.sheet,d=sh.d;
  return {kind:d.kind,name:d.name.trim(),phone:d.phone.trim(),addr:d.kind==='delivery'?d.addr.trim():'',when:d.when?new Date(d.when).getTime():null,fee:d.kind==='delivery'?r2(num(d.fee)):0,note:d.note.trim(),cid:d.cid||null};
}
Object.assign(A,{
orders:()=>openSheet({type:'orders',f:'active'}),
'ord-f':d=>{ui.sheet.f=d.v;renderSheet()},
'make-order':()=>{
  if(!ui.cart.filter(l=>l.qty>0).length)return;
  const items=ui.cart.filter(l=>l.qty>0).map(l=>({pid:l.pid,name:l.name,unit:l.unit||'pc',qty:l.qty,price:l.price,cost:l.cost}));
  openSheet({type:'order',id:null,items,d:{kind:'delivery',name:'',phone:'',addr:'',when:'',fee:'',note:'',cid:null}});
},
'order-open':d=>{const o=S.orders.find(x=>x.id===d.id);if(!o)return;openSheet({type:'order',id:o.id,d:{kind:o.kind,name:o.name,phone:o.phone,addr:o.addr,when:o.when?toLocalDT(o.when):'',fee:o.fee>0?String(o.fee):'',note:o.note,cid:o.cid}})},
'ord-kind':d=>{ui.sheet.d.kind=d.v;renderSheet()},
'ord-cust':d=>{const c=S.customers.find(x=>x.id===d.id);if(!c)return;const dd=ui.sheet.d;dd.cid=c.id;dd.name=c.name;if(c.phone)dd.phone=c.phone;renderSheet()},
'order-save':()=>{
  const sh=ui.sheet,f=ordFromSheet();
  if(sh.id){const o=S.orders.find(x=>x.id===sh.id);if(o)Object.assign(o,f)}
  else{
    S.orders.push(Object.assign({id:uid(),ts:Date.now(),items:sh.items,status:'preparing'},f));
    ui.cart=[];ui.tier='retail';
  }
  save();closeSheet();render();toast(t('ord_saved'));
},
'order-st':d=>{const sh=ui.sheet,o=S.orders.find(x=>x.id===sh.id);if(!o)return;Object.assign(o,ordFromSheet());o.status=d.v;if(d.v==='done')o.doneTs=Date.now();save();renderSheet();renderMain()},
'order-complete':()=>{
  const sh=ui.sheet,o=S.orders.find(x=>x.id===sh.id);if(!o)return;
  Object.assign(o,ordFromSheet());save();
  ui.cart=o.items.map(i=>({key:'ord:'+uid(),pid:i.pid,name:i.name,unit:i.unit,price:i.price,cost:i.cost,qty:i.qty}));
  if(o.fee>0)ui.cart.push({key:'ord:'+uid(),pid:null,name:t('ord_fee_line'),unit:'pc',price:o.fee,cost:null,qty:1});
  ui.orderRef=o.id;ui.tier='retail';
  openSheet({type:'checkout',method:'cash',given:'',cid:null,newName:'',dtype:'peso',dval:''});
  renderCart();
},
'order-copy':()=>{const sh=ui.sheet,o=S.orders.find(x=>x.id===sh.id);if(!o)return;Object.assign(o,ordFromSheet());save();shareText(orderText(o))},
'order-del':()=>{const sh=ui.sheet;if(!sh.confirmDel){sh.confirmDel=true;renderSheet();return}S.orders=S.orders.filter(x=>x.id!==sh.id);save();A.orders();renderMain()}
});
['order-del'].forEach(k=>OWNER.add(k));
document.addEventListener('input',e=>{
  const el=e.target,k=el.dataset&&el.dataset.in,sh=ui.sheet;if(!k||!sh||sh.type!=='order')return;
  const map={oname:'name',ophone:'phone',oaddr:'addr',owhen:'when',ofee:'fee',onote:'note'};
  if(map[k]){sh.d[map[k]]=el.value;if(k==='ofee'){const o=sh.id&&S.orders.find(x=>x.id===sh.id),items=o?o.items:sh.items;const tt=$('#ototal');if(tt)tt.textContent=peso(items.reduce((a,i)=>a+i.price*i.qty,0)+num(el.value))}}
});

const rptHead=()=>`${S.info.logo?`<img class="dlogo" src="${S.info.logo}" alt="">`:''}<div class="dshop">${esc(S.shop)}</div>${infoLines().map(x=>`<div class="dd">${esc(x)}</div>`).join('')}`;

  <div class="field"><span>${esc(t('si_logo'))}</span>${i.logo?`<img class="dlogo" style="margin:6px 0" src="${i.logo}" alt="">`:''}<div class="row2"><label class="btn" style="display:grid;place-items:center;cursor:pointer">${esc(i.logo?t('si_logo_change'):t('si_logo_pick'))}<input id="sifile" type="file" accept="image/*" hidden></label>${i.logo?`<button class="btn ghost-red" data-act="si-logo-del">${esc(t('remove_img'))}</button>`:''}</div></div>
  <label class="field"><span>${esc(t('si_addr'))}</span><input id="siaddr" autocomplete="off" value="${esc(i.addr)}" data-in="si-addr"></label>

  <label class="field"><span>${esc(t('si_foot'))}</span><input id="sifoot" autocomplete="off" value="${esc(i.foot)}" data-in="si-foot" placeholder="${esc(t('thanks'))}"></label>
